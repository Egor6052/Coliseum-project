<h2>View Records (Current Month)</h2>
<button onclick="viewRecords()">View Records</button>
<div id="recordsResponse" class="response"></div>
<script>
    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = '/';
        }
    };

    async function viewRecords() {
        const response = await fetch('/records?fetch=true');
        const data = await response.json();
        
        if (data.status !== "Success") {
            document.getElementById('recordsResponse').innerText = "Error: Could not fetch records";
            return;
        }

        // Парсимо рядок data.data у JSON
        const records = JSON.parse(data.data);

        // Якщо немає записів за поточний місяць
        if (records.length === 0) {
            document.getElementById('recordsResponse').innerText = "No records found for the current month.";
            return;
        }

        // Створюємо HTML-таблицю
        let tableHtml = `
            <style>
                .records-table {
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 10px;
                    font-size: 14px;
                }
                .records-table th, .records-table td {
                    border: 1px solid #ddd;
                    padding: 8px;
                    text-align: center;
                }
                .records-table th {
                    background-color: #333;
                    color: white;
                }
                .records-table tr:nth-child(even) {
                    background-color: #f2f2f2;
                }
                .records-table tr:hover {
                    background-color: #ddd;
                }
            </style>
            <table class="records-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Sensor Name</th>
                        <th>IP Address</th>
                        <th>Date</th>
                        <th>Active Power (W)</th>
                        <th>Reactive Power (VAR)</th>
                        <th>Voltage (V)</th>
                        <th>Current (A)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        // Додаємо рядки до таблиці
        records.forEach(record => {
            tableHtml += `
                <tr>
                    <td>${record.id}</td>
                    <td>${record.sensor_name}</td>
                    <td>${record.ip_address}</td>
                    <td>${record.date}</td>
                    <td>${record.active_power.toFixed(2)}</td>
                    <td>${record.reactive_power.toFixed(2)}</td>
                    <td>${record.voltage.toFixed(2)}</td>
                    <td>${record.current.toFixed(2)}</td>
                </tr>
            `;
        });

        tableHtml += `
                </tbody>
            </table>
        `;

        // Вставляємо таблицю у DOM
        document.getElementById('recordsResponse').innerHTML = tableHtml;
    }
</script>
